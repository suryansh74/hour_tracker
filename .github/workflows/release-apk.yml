name: Release APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.4-intervaltest3)'
        required: true
      prerelease:
        description: 'Pre-release (true/false)'
        required: false
        default: 'true'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build apk --release

      - name: Tag name
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
            echo "pre=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "name=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "pre=true" >> $GITHUB_OUTPUT
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          PRE="${{ steps.tag.outputs.pre }}"
          ARGS=( "$TAG" "build/app/outputs/flutter-apk/app-release.apk" --title "Hour Tracker $TAG" --notes "Automated release build. Install app-release.apk from Assets." )
          if [ "$PRE" = "true" ]; then
            ARGS+=( --prerelease )
          fi
          # Replace release if tag already exists without assets
          gh release create "${ARGS[@]}" || gh release upload "$TAG" "build/app/outputs/flutter-apk/app-release.apk" --clobber
