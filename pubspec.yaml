name: hour_tracker
description: Hourly self-monitoring and productivity dashboard app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Hourly beep notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Dashboard charts
  fl_chart: ^0.68.0

  # CSV export / sharing
  path_provider: ^2.1.4
  share_plus: ^10.0.0

  # Persisted simple key-value (theme mode etc.)
  shared_preferences: ^2.2.3

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
