name: hour_tracker
description: Offline-first Flutter productivity tracker that logs your activity every hour with reminders, analytics dashboards, calendar heatmaps, and CSV export.
publish_to: "none"
version: 1.0.4-intervaltest+10

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Hourly beep notifications
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Dashboard charts
  fl_chart: ^0.68.0

  # CSV export / sharing
  path_provider: ^2.1.4
  share_plus: ^10.0.0

  # Persisted simple key-value (theme mode etc.)
  shared_preferences: ^2.2.3

  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#E8F4FC"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
